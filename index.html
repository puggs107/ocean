
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03070b">
<title>深海回音 | Echoes of the Deep</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap');

:root {
  --black:#03070b;
  --deep:#07111a;
  --glass:rgba(255,255,255,.045);
  --glass-hover:rgba(255,255,255,.085);
  --line:rgba(210,230,240,.16);
  --text:#e9eff3;
  --muted:#778995;
  --silver:#c4d2d9;
  --glow:rgba(170,215,230,.16);
  --gold:#d5c5a4;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:var(--black);
  color:var(--text);
  font-family:'DM Sans','Noto Serif SC',sans-serif;
  font-weight:300;
}

/* 深海背景 */

.ocean{
  position:fixed;
  inset:0;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(ellipse at 50% 110%,rgba(22,54,67,.32),transparent 55%),
    radial-gradient(ellipse at 15% 20%,rgba(30,55,67,.13),transparent 45%),
    linear-gradient(180deg,#020406 0%,#050b10 48%,#08131b 100%);
}

.ocean::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.25;
  background-image:
    radial-gradient(1px 1px at 15% 23%,#b5d4dc 50%,transparent 100%),
    radial-gradient(1px 1px at 75% 18%,#c1d6dc 50%,transparent 100%),
    radial-gradient(1px 1px at 42% 68%,#9ebdc5 50%,transparent 100%),
    radial-gradient(1px 1px at 90% 73%,#b5d4dc 50%,transparent 100%),
    radial-gradient(1px 1px at 24% 82%,#9ebdc5 50%,transparent 100%);
  background-size:320px 320px;
  animation:particleDrift 35s linear infinite;
}

.ocean::after{
  content:"";
  position:absolute;
  width:75vw;
  height:75vw;
  max-width:850px;
  max-height:850px;
  left:50%;
  top:55%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(42,83,95,.075),transparent 70%);
  filter:blur(40px);
  animation:deepGlow 12s ease-in-out infinite alternate;
}

@keyframes particleDrift{
  from{transform:translateY(0)}
  to{transform:translateY(-320px)}
}

@keyframes deepGlow{
  from{opacity:.4;transform:translate(-50%,-50%) scale(.9)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
}

.wave{
  position:absolute;
  width:180%;
  height:180%;
  left:-40%;
  top:65%;
  border-radius:44%;
  border:1px solid rgba(161,203,214,.035);
  background:transparent;
  animation:deepWave 32s linear infinite;
}

.wave:nth-child(2){
  animation-duration:43s;
  top:68%;
  border-color:rgba(161,203,214,.025);
}

.wave:nth-child(3){
  animation-duration:55s;
  top:70%;
  border-color:rgba(161,203,214,.02);
}

@keyframes deepWave{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* 品牌标题 */

header{
  position:absolute;
  top:12%;
  left:0;
  right:0;
  z-index:5;
  text-align:center;
  pointer-events:none;
}

.logo{
  font-family:'Noto Serif SC',serif;
  font-size:clamp(30px,4vw,48px);
  font-weight:300;
  letter-spacing:16px;
  padding-left:16px;
  color:#e4e9eb;
  text-shadow:0 0 35px rgba(196,224,232,.12);
}

.subtitle{
  margin-top:22px;
  font-family:'DM Sans',sans-serif;
  font-size:10px;
  font-weight:300;
  letter-spacing:5px;
  color:rgba(185,204,211,.48);
}

.ocean-message{
  position:absolute;
  top:27%;
  left:0;
  right:0;
  z-index:3;
  text-align:center;
  color:rgba(185,204,211,.53);
  font-size:12px;
  letter-spacing:5px;
  pointer-events:none;
}

/* 新增：情绪词漂浮层 */

.emotion-words{
  position:absolute;
  inset:0;
  z-index:2;
  overflow:hidden;
  pointer-events:none;
}

.emotion-word{
  position:absolute;
  white-space:nowrap;
  font-family:'Noto Serif SC',serif;
  font-size:13px;
  font-weight:300;
  letter-spacing:3px;
  color:rgba(196,225,232,.65);
  text-shadow:
    0 0 8px rgba(173,224,235,.55),
    0 0 20px rgba(146,206,221,.28);
  opacity:0;
  animation:emotionFloat 12s ease-in-out infinite;
  user-select:none;
}

.emotion-word.positive{
  color:rgba(225,207,166,.78);
  text-shadow:
    0 0 8px rgba(229,202,151,.55),
    0 0 22px rgba(220,190,130,.25);
}

.emotion-word.negative{
  color:rgba(153,187,205,.72);
  text-shadow:
    0 0 8px rgba(135,182,204,.5),
    0 0 22px rgba(105,155,180,.25);
}

@keyframes emotionFloat{
  0%{
    opacity:0;
    transform:translate3d(0,12px,0);
  }
  15%{
    opacity:.85;
  }
  50%{
    transform:translate3d(12px,-18px,0);
    opacity:.65;
  }
  85%{
    opacity:.8;
  }
  100%{
    opacity:0;
    transform:translate3d(-8px,-38px,0);
  }
}

/* 漂流瓶气泡 */

.bubbles{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.bubble{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  border:1px solid rgba(205,231,237,.7);
  background:rgba(210,239,243,.5);
  box-shadow:0 0 7px rgba(182,227,235,.65),0 0 18px rgba(150,205,216,.16);
  cursor:pointer;
  pointer-events:auto;
  animation:float 6s ease-in-out infinite;
  transition:transform .4s,opacity .4s,box-shadow .4s;
}

.bubble:hover{
  transform:scale(3);
  box-shadow:0 0 12px rgba(220,244,248,.9),0 0 30px rgba(166,224,235,.35);
}

@keyframes float{
  0%,100%{margin-top:0}
  50%{margin-top:-17px}
}

/* 底部操作面板 */

.actions{
  position:absolute;
  bottom:13%;
  left:0;
  right:0;
  z-index:5;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  padding:0 20px;
}

.action-btn{
  position:relative;
  overflow:hidden;
  min-width:155px;
  padding:15px 24px;
  border-radius:3px;
  border:1px solid rgba(190,220,230,.17);
  background:rgba(255,255,255,.035);
  color:rgba(225,236,240,.85);
  font-family:'DM Sans','Noto Serif SC',sans-serif;
  font-size:11px;
  font-weight:400;
  letter-spacing:3px;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  transition:all .4s ease;
}

.action-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(110deg,transparent,rgba(207,237,244,.10),transparent);
  transform:translateX(-120%);
  transition:transform .65s;
}

.action-btn:hover::before{transform:translateX(120%)}

.action-btn:hover{
  background:rgba(180,220,230,.075);
  border-color:rgba(203,235,242,.4);
  box-shadow:0 0 25px rgba(156,209,222,.09),inset 0 0 15px rgba(183,224,233,.035);
  color:#fff;
  transform:translateY(-2px);
}

.action-btn:active{transform:scale(.98)}

.footer{
  position:absolute;
  bottom:4%;
  left:0;
  right:0;
  z-index:4;
  text-align:center;
  font-family:'DM Sans',sans-serif;
  font-size:9px;
  font-weight:300;
  letter-spacing:5px;
  color:rgba(180,203,211,.27);
  pointer-events:none;
}

/* 液态玻璃弹窗 */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,4,8,.65);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.show{display:flex}

.panel{
  position:relative;
  width:min(450px,100%);
  max-height:88vh;
  overflow-y:auto;
  padding:38px 32px;
  border-radius:5px;
  border:1px solid rgba(211,235,242,.19);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018)),rgba(5,14,21,.87);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09),0 0 45px rgba(137,198,211,.035);
  animation:panelIn .5s cubic-bezier(.2,.8,.2,1);
}

@keyframes panelIn{
  from{opacity:0;transform:translateY(18px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.panel h2{
  margin:0 0 12px;
  text-align:center;
  font-family:'Noto Serif SC',serif;
  font-weight:300;
  font-size:22px;
  letter-spacing:8px;
  color:#e1e9ec;
}

.panel .desc{
  margin-bottom:32px;
  text-align:center;
  font-size:10px;
  font-weight:300;
  letter-spacing:3px;
  color:rgba(178,201,211,.48);
}

.close{
  position:absolute;
  top:17px;
  right:20px;
  border:0;
  background:none;
  color:rgba(200,222,230,.55);
  font-size:23px;
  font-weight:200;
  cursor:pointer;
  transition:color .3s,transform .3s;
}

.close:hover{color:white;transform:rotate(90deg)}

/* 输入框 */

.field{margin-bottom:22px}

.field label{
  display:block;
  margin-bottom:12px;
  color:rgba(183,208,217,.65);
  font-size:10px;
  letter-spacing:3px;
}

.field input,.field textarea{
  display:block;
  width:100%;
  padding:14px 15px;
  border-radius:3px;
  outline:none;
  resize:vertical;
  color:#e7f0f3;
  font-family:'Noto Serif SC',serif;
  font-size:13px;
  font-weight:300;
  line-height:1.8;
  border:1px solid rgba(190,220,229,.15);
  background:rgba(255,255,255,.035);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:all .35s;
}

.field input:focus,.field textarea:focus{
  border-color:rgba(183,223,233,.48);
  background:rgba(255,255,255,.065);
  box-shadow:0 0 22px rgba(159,213,224,.06);
}

.field input::placeholder,.field textarea::placeholder{
  color:rgba(163,185,194,.35);
  font-weight:300;
}

/* 情绪选择按钮 */

.emotion-buttons{display:flex;gap:12px}

.emotion-buttons button{
  flex:1;
  min-height:48px;
  border-radius:3px;
  border:1px solid rgba(195,220,229,.19);
  background:rgba(255,255,255,.04);
  color:rgba(224,236,240,.82);
  font-family:'DM Sans','Noto Serif SC',sans-serif;
  font-size:11px;
  letter-spacing:2px;
  transition:.35s;
  cursor:pointer;
}

.emotion-buttons button:first-child:hover{
  border-color:rgba(224,196,150,.55);
  background:rgba(224,196,150,.09);
  box-shadow:0 0 24px rgba(224,196,150,.09);
}

.emotion-buttons button:last-child:hover{
  border-color:rgba(143,181,199,.55);
  background:rgba(143,181,199,.09);
  box-shadow:0 0 24px rgba(143,181,199,.09);
}

.emotion-buttons button:disabled{opacity:.5;cursor:wait}

/* 漂流瓶颜色 */

.color-list{display:flex;gap:17px;flex-wrap:wrap;padding:8px 2px}

.color-option{
  width:22px;
  height:22px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  cursor:pointer;
  transition:.3s;
}

.color-option.selected{
  outline:1px solid rgba(231,245,249,.9);
  outline-offset:4px;
  transform:scale(1.05);
  box-shadow:0 0 15px rgba(223,240,245,.3);
}

/* 提交按钮 */

.submit{
  position:relative;
  overflow:hidden;
  min-height:46px;
  padding:12px 18px;
  border-radius:3px;
  border:1px solid rgba(200,229,236,.3);
  background:rgba(190,224,232,.075);
  color:#e4eef1;
  font-family:'DM Sans','Noto Serif SC',sans-serif;
  font-size:11px;
  font-weight:400;
  letter-spacing:3px;
  cursor:pointer;
  transition:all .35s;
}

.submit:hover{
  background:rgba(190,224,232,.14);
  border-color:rgba(218,244,249,.65);
  box-shadow:0 0 28px rgba(164,217,227,.12);
}

.submit:active{transform:scale(.985)}
.submit:disabled{opacity:.45;cursor:wait}

/* 漂流瓶卡片 */

.bottle-card{
  position:relative;
  padding:25px 22px;
  min-height:160px;
  border-radius:3px;
  border:1px solid rgba(255,255,255,.5);
  color:#26323a;
  background:rgba(222,235,238,.85);
  box-shadow:0 15px 45px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.65);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.bottle-card .sender{
  margin-bottom:20px;
  font-family:'DM Sans',sans-serif;
  font-size:10px;
  letter-spacing:2px;
  opacity:.65;
}

.bottle-card .content{
  font-family:'Noto Serif SC',serif;
  font-size:16px;
  line-height:2.1;
  font-weight:400;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* 回音输入区域 */

.reply-area{margin-top:27px}

.reply-area label{
  color:rgba(184,207,216,.7);
  font-size:10px;
  letter-spacing:3px;
}

.reply-area textarea,#replierName{
  display:block;
  width:100%;
  margin-top:13px;
  padding:13px;
  color:#e6eff2;
  border-radius:3px;
  border:1px solid rgba(190,220,229,.16);
  background:rgba(255,255,255,.04);
  outline:none;
  font-family:'Noto Serif SC',serif;
  font-size:12px;
  font-weight:300;
  line-height:1.8;
  resize:vertical;
  transition:.3s;
}

.reply-area textarea:focus,#replierName:focus{
  border-color:rgba(183,223,233,.45);
  box-shadow:0 0 20px rgba(159,213,224,.05);
}

.reply-area textarea::placeholder,#replierName::placeholder{
  color:rgba(163,185,194,.35);
}

#noticeContent{
  color:#d9e5e9;
  font-family:'Noto Serif SC',serif;
  font-size:13px;
  line-height:2.1;
}

#noticeContent>div{
  border-bottom:1px solid rgba(220,238,242,.12)!important;
}

/* 情绪扩散 */

.ripple{
  position:absolute;
  pointer-events:none;
  width:25px;
  height:25px;
  border-radius:50%;
  border:1px solid rgba(220,235,235,.65);
  box-shadow:0 0 20px rgba(180,225,230,.13);
  animation:ripple 3s ease-out forwards;
}

.ripple.negative{
  border-color:rgba(101,139,157,.65);
  box-shadow:0 0 28px rgba(78,116,138,.13);
}

@keyframes ripple{
  from{transform:scale(.2);opacity:.8}
  to{transform:scale(16);opacity:0}
}

/* 消息提示 */

.toast{
  position:fixed;
  top:28px;
  left:50%;
  z-index:100;
  transform:translateX(-50%) translateY(-15px);
  padding:13px 24px;
  max-width:90%;
  border:1px solid rgba(200,230,236,.2);
  border-radius:3px;
  background:rgba(5,15,22,.86);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  color:#dce8eb;
  font-family:'DM Sans','Noto Serif SC',sans-serif;
  font-size:11px;
  letter-spacing:2px;
  text-align:center;
  opacity:0;
  transition:.35s;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* 移动端 */

@media(max-width:600px){
  header{top:16%}

  .logo{
    font-size:32px;
    letter-spacing:10px;
    padding-left:10px;
  }

  .subtitle{
    margin-top:17px;
    letter-spacing:3px;
    font-size:9px;
  }

  .ocean-message{
    top:32%;
    padding:0 15px;
    font-size:11px;
    letter-spacing:3px;
  }

  .emotion-word{
    font-size:11px;
    letter-spacing:2px;
  }

  .actions{bottom:13%;gap:11px}

  .action-btn{
    min-width:140px;
    padding:14px 12px;
    font-size:10px;
    letter-spacing:2px;
  }

  .panel{padding:34px 22px}

  .panel h2{
    font-size:19px;
    letter-spacing:5px;
  }

  .footer{bottom:4%;letter-spacing:3px}
}

@media(max-height:650px){
  header{top:7%}
  .ocean-message{top:25%}
  .actions{bottom:8%}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div class="ocean">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<header>
  <div class="logo">深海回音</div>
  <div class="subtitle">将无法言说的情绪，沉入海底</div>
</header>

<div class="ocean-message">
  SOME FEELINGS DESERVE TO BE HEARD
</div>

<!-- 新增：情绪词漂浮容器 -->
<div class="emotion-words" id="emotionWords"></div>

<div class="bubbles" id="bubbles"></div>

<div class="actions">
  <button class="action-btn" onclick="openModal('emotionModal')">
    ◇ &nbsp;滴入情绪
  </button>

  <button class="action-btn" onclick="openModal('bottleModal')">
    + &nbsp;投放漂流瓶
  </button>

  <button class="action-btn" onclick="pickBottle()">
    ○ &nbsp;拾取回音
  </button>
</div>

<div class="footer">
  ECHOES OF THE DEEP &nbsp;·&nbsp; AN OCEAN WITHOUT JUDGEMENT
</div>

<div class="toast" id="toast"></div>

<!-- 情绪弹窗 -->
<div class="modal" id="emotionModal">
  <div class="panel">
    <button class="close" onclick="closeModal('emotionModal')">×</button>
    <h2>滴入一滴情绪</h2>
    <div class="desc">EVERY EMOTION HAS A PLACE</div>

    <div class="field">
      <label>此刻的情绪</label>
      <input id="emotionText" maxlength="100"
        placeholder="写下一个词，或者一段无法言说的话……">
    </div>

    <div class="emotion-buttons">
      <button onclick="submitEmotion(true)">☼ &nbsp;正能量</button>
      <button onclick="submitEmotion(false)">☾ &nbsp;负面情绪</button>
    </div>
  </div>
</div>

<!-- 漂流瓶弹窗 -->
<div class="modal" id="bottleModal">
  <div class="panel">
    <button class="close" onclick="closeModal('bottleModal')">×</button>
    <h2>投放一只漂流瓶</h2>
    <div class="desc">LEAVE SOMETHING BEHIND</div>

    <div class="field">
      <label>你的代号</label>
      <input id="senderName" maxlength="30"
        placeholder="可以匿名，也可以留下名字">
    </div>

    <div class="field">
      <label>想留下的心事</label>
      <textarea id="bottleContent" maxlength="1000"
        placeholder="这里没有评判，也没有打扰。"></textarea>
    </div>

    <div class="field">
      <label>漂流瓶的底色</label>
      <div class="color-list" id="colorList">
        <div class="color-option selected" data-color="#f1d7b3" style="background:#f1d7b3"></div>
        <div class="color-option" data-color="#b8d7d9" style="background:#b8d7d9"></div>
        <div class="color-option" data-color="#d7b9d9" style="background:#d7b9d9"></div>
        <div class="color-option" data-color="#e8b8ad" style="background:#e8b8ad"></div>
        <div class="color-option" data-color="#c3d1ae" style="background:#c3d1ae"></div>
        <div class="color-option" data-color="#b7c8e8" style="background:#b7c8e8"></div>
      </div>
    </div>

    <button class="submit" id="sendBottleBtn"
      style="width:100%" onclick="sendBottle()">
      让它沉入深海 &nbsp; →
    </button>
  </div>
</div>

<!-- 捞瓶子弹窗 -->
<div class="modal" id="readModal">
  <div class="panel">
    <button class="close" onclick="closeModal('readModal')">×</button>
    <h2>一封来自深海的信</h2>
    <div class="desc">SOMEWHERE, SOMEONE IS LISTENING</div>

    <div class="bottle-card" id="bottleCard">
      <div class="sender" id="readSender"></div>
      <div class="content" id="readContent"></div>
    </div>

    <div class="reply-area">
      <label>给这段心事留下一点回音</label>

      <textarea id="replyContent" maxlength="500"
        placeholder="不必说很多，真诚就足够……"></textarea>

      <input id="replierName" maxlength="30"
        placeholder="你的代号（选填）">

      <button class="submit" id="replyBtn"
        style="width:100%;margin-top:16px" onclick="sendReply()">
        送出回音 &nbsp; →
      </button>
    </div>

    <button class="submit"
      style="width:100%;margin-top:12px"
      onclick="closeModal('readModal')">
      返回深海
    </button>
  </div>
</div>

<!-- 收信提醒 -->
<div class="modal" id="noticeModal">
  <div class="panel">
    <button class="close" onclick="closeModal('noticeModal')">×</button>
    <h2>有人回应了你</h2>
    <div class="desc">YOUR MESSAGE WAS NOT LOST</div>

    <div id="noticeContent"
      style="font-size:13px;line-height:2;color:#d9e5e9">
    </div>

    <button class="submit"
      style="width:100%;margin-top:24px"
      onclick="closeModal('noticeModal')">
      收下这份回音
    </button>
  </div>
</div>

<script>
/* ===============================
   Supabase 配置
================================ */
const SUPABASE_URL = 'https://zeflzagbkmhlztgoonhv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gDzw3L7S1HCk1kQ3rA3a_A_PTc5pyJG';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentBottle = null;
let selectedColor = '#f1d7b3';
let bubbleCount = 0;
const MAX_BUBBLES = 30;

/* ===============================
   通用工具
================================ */
function openModal(id){
  document.getElementById(id).classList.add('show');
}

function closeModal(id){
  document.getElementById(id).classList.remove('show');
}

function toast(message){
  const el=document.getElementById('toast');
  el.textContent=message;
  el.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

function setLoading(id,loading,text){
  const el=document.getElementById(id);
  el.disabled=loading;
  if(loading){
    el.dataset.oldText=el.textContent;
    el.textContent='正在送往海洋……';
  }else{
    el.textContent=text || el.dataset.oldText || '提交';
  }
}

function safeText(value){
  return String(value ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ===============================
   新增：情绪词漂浮效果
================================ */

// 在海面随机位置生成一个发光情绪词
function createEmotionWord(word,positive){
  if(!word || !word.trim())return;

  const container=document.getElementById('emotionWords');
  const el=document.createElement('div');

  el.className='emotion-word '+(positive?'positive':'negative');

  // 使用 textContent，避免用户输入内容被解析为 HTML
  el.textContent=word;

  // 随机位置，避开顶部标题和底部操作区域
  el.style.left=(5+Math.random()*85)+'%';
  el.style.top=(36+Math.random()*39)+'%';

  // 随机动画延迟、时长和透明度
  const duration=10+Math.random()*8;
  el.style.animationDuration=duration+'s';
  el.style.animationDelay=(Math.random()*3)+'s';
  el.style.fontSize=(11+Math.random()*4)+'px';

  container.appendChild(el);

  // 动画完成后移除元素
  setTimeout(()=>{
    el.remove();
  },(duration+4)*1000);
}

// 从数据库读取最近30条情绪词
async function loadEmotionWords(){
  const {data,error}=await db
    .from('ocean_colors')
    .select('id,is_positive,emotion_word,created_at')
    .not('emotion_word','is',null)
    .order('created_at',{ascending:false})
    .limit(30);

  if(error){
    console.error('读取情绪词失败:',error);
    return;
  }

  // 让情绪词依次出现在海面上
  (data||[]).reverse().forEach((item,index)=>{
    if(item.emotion_word && item.emotion_word.trim()){
      setTimeout(()=>{
        createEmotionWord(item.emotion_word,item.is_positive);
      },index*250);
    }
  });
}

/* ===============================
   海面情绪痕迹
================================ */
function createRipple(positive,x,y){
  const ripple=document.createElement('div');
  ripple.className='ripple'+(positive?'':' negative');
  ripple.style.left=(x ?? Math.random()*window.innerWidth)+'px';
  ripple.style.top=(y ?? Math.random()*window.innerHeight)+'px';
  document.querySelector('.ocean').appendChild(ripple);
  setTimeout(()=>ripple.remove(),2700);
}

// 随机位置生成历史情绪痕迹
async function loadOceanColors(){
  const {data,error}=await db
    .from('ocean_colors')
    .select('id,is_positive,created_at')
    .order('created_at',{ascending:false})
    .limit(15);

  if(error){
    console.error('读取情绪记录失败:',error);
    return;
  }

  (data||[]).forEach((item,index)=>{
    setTimeout(()=>{
      createRipple(item.is_positive);
    },index*180);
  });
}

// 实时监听其他用户滴入的情绪
function subscribeOcean(){
  db.channel('ocean-colors-live')
    .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'ocean_colors'
    },payload=>{
      const item=payload.new;
      createRipple(item.is_positive);

      // 新增：其他用户提交的情绪词也实时漂浮
      if(item.emotion_word){
        createEmotionWord(item.emotion_word,item.is_positive);
      }
    })
    .subscribe();
}

/* ===============================
   滴入情绪
================================ */
async function submitEmotion(positive){
  const text=document.getElementById('emotionText').value.trim();

  if(!text){
    toast('请先写下此刻的心情');
    return;
  }

  const buttons=document.querySelectorAll('.emotion-buttons button');
  buttons.forEach(b=>b.disabled=true);

  try{
    const {error}=await db.from('ocean_colors').insert({
      is_positive:positive,
      emotion_word:text
    });

    if(error)throw error;

    createRipple(positive);

    // 新增：提交成功后立即在当前海面显示情绪词
    createEmotionWord(text,positive);

    document.getElementById('emotionText').value='';
    closeModal('emotionModal');

    toast(positive?'☀ 一束暖光，已经融入海洋':'🌧️ 海洋接住了你的情绪');

  }catch(error){
    console.error(error);
    toast('情绪没有成功送达，请检查数据库权限');
  }finally{
    buttons.forEach(b=>b.disabled=false);
  }
}

/* ===============================
   漂流瓶颜色选择
================================ */
document.querySelectorAll('.color-option').forEach(option=>{
  option.addEventListener('click',()=>{
    document.querySelectorAll('.color-option').forEach(el=>el.classList.remove('selected'));
    option.classList.add('selected');
    selectedColor=option.dataset.color;
  });
});

/* ===============================
   扔下漂流瓶
================================ */
async function sendBottle(){
  const sender=document.getElementById('senderName').value.trim();
  const content=document.getElementById('bottleContent').value.trim();

  if(!sender){
    toast('请留下你的代号');
    return;
  }

  if(!content){
    toast('漂流瓶里还没有心事');
    return;
  }

  setLoading('sendBottleBtn',true);

  try{
    const {data,error}=await db
      .from('bottles')
      .insert({
        sender_name:sender,
        content:content,
        card_color:selectedColor
      })
      .select('id')
      .single();

    if(error)throw error;

    const ids=JSON.parse(localStorage.getItem('myOceanBottles')||'[]');
    ids.push(data.id);

    localStorage.setItem(
      'myOceanBottles',
      JSON.stringify([...new Set(ids)])
    );

    document.getElementById('senderName').value='';
    document.getElementById('bottleContent').value='';

    closeModal('bottleModal');

    createRipple(true);
    toast('漂流瓶已经启航，愿有人读懂你');

    await renderBubbles();

  }catch(error){
    console.error(error);
    toast('漂流瓶投放失败，请检查数据库权限');
  }finally{
    setLoading('sendBottleBtn',false,'让它沉入深海 →');
  }
}

/* ===============================
   迷你漂流瓶气泡
================================ */
function createBubble(){
  const container=document.getElementById('bubbles');
  if(bubbleCount>=MAX_BUBBLES)return;

  const bubble=document.createElement('div');
  bubble.className='bubble';
  bubble.style.left=(5+Math.random()*90)+'%';
  bubble.style.top=(20+Math.random()*65)+'%';
  bubble.style.animationDelay=(-Math.random()*4)+'s';
  bubble.title='捞起一只漂流瓶';

  bubble.addEventListener('click',()=>{
    bubble.style.transform='scale(3)';
    bubble.style.opacity='0';

    setTimeout(()=>{
      bubble.remove();
      bubbleCount=Math.max(0,bubbleCount-1);
      pickBottle();
    },200);
  });

  container.appendChild(bubble);
  bubbleCount++;
}

async function renderBubbles(){
  const container=document.getElementById('bubbles');
  container.innerHTML='';
  bubbleCount=0;

  const {count,error}=await db
    .from('bottles')
    .select('*',{count:'exact',head:true});

  if(error){
    console.error('读取漂流瓶数量失败:',error);
    return;
  }

  const number=Math.min(count||0,MAX_BUBBLES);

  for(let i=0;i<number;i++){
    createBubble();
  }
}

/* ===============================
   随机捞取漂流瓶
================================ */
async function pickBottle(){
  try{
    const {count,error:countError}=await db
      .from('bottles')
      .select('id',{count:'exact',head:true});

    if(countError)throw countError;

    if(!count){
      toast('海面还很安静，等待第一只漂流瓶');
      return;
    }

    const randomIndex=Math.floor(Math.random()*count);

    const {data,error}=await db
      .from('bottles')
      .select('id,sender_name,content,card_color,created_at')
      .range(randomIndex,randomIndex);

    if(error)throw error;

    if(!data || !data.length){
      toast('这只漂流瓶暂时没有找到');
      return;
    }

    currentBottle=data[0];

    document.getElementById('readSender').textContent=
      '来自：'+(currentBottle.sender_name||'匿名旅人');

    document.getElementById('readContent').textContent=
      currentBottle.content;

    document.getElementById('bottleCard').style.background=
      currentBottle.card_color||'#f1d7b3';

    document.getElementById('replyContent').value='';
    document.getElementById('replierName').value='';

    document.getElementById('replyBtn').disabled=false;

    openModal('readModal');

  }catch(error){
    console.error(error);
    toast('捞取失败，请稍后再试');
  }
}

/* ===============================
   写回音
================================ */
async function sendReply(){
  if(!currentBottle)return;

  const content=document.getElementById('replyContent').value.trim();
  const name=document.getElementById('replierName').value.trim()||'海洋旅人';

  if(!content){
    toast('写下一段回音吧');
    return;
  }

  setLoading('replyBtn',true);

  try{
    const {error}=await db.from('bottle_replies').insert({
      bottle_id:currentBottle.id,
      replier_name:name,
      reply_content:content
    });

    if(error)throw error;

    document.getElementById('replyContent').value='';
    closeModal('readModal');

    toast('你的回音已经抵达远方');

  }catch(error){
    console.error(error);
    toast('回音发送失败，请检查数据库权限');
  }finally{
    setLoading('replyBtn',false,'送出回音 →');
  }
}

/* ===============================
   收信提醒
================================ */
async function checkReplies(){
  try{
    const ids=JSON.parse(localStorage.getItem('myOceanBottles')||'[]');

    if(!Array.isArray(ids)||ids.length===0)return;

    const {data,error}=await db
      .from('bottle_replies')
      .select('bottle_id,replier_name,reply_content')
      .in('bottle_id',ids);

    if(error)throw error;

    if(!data||data.length===0)return;

    const notified=JSON.parse(
      localStorage.getItem('notifiedOceanReplies')||'[]'
    );

    const newReplies=data.filter(item=>{
      const key=String(item.bottle_id)+'_'+
        String(item.replier_name)+'_'+
        String(item.reply_content);

      return !notified.includes(key);
    });

    if(newReplies.length===0)return;

    const html=newReplies.map(item=>{
      const key=String(item.bottle_id)+'_'+
        String(item.replier_name)+'_'+
        String(item.reply_content);

      notified.push(key);

      return `
        <div style="padding:12px 0;border-bottom:1px solid rgba(255,255,255,.12)">
          <div style="color:#c4d2d9;font-size:12px;margin-bottom:5px">
            ${safeText(item.replier_name||'海洋旅人')} 留下了回音
          </div>
          <div>${safeText(item.reply_content)}</div>
        </div>`;
    }).join('');

    localStorage.setItem(
      'notifiedOceanReplies',
      JSON.stringify(notified)
    );

    document.getElementById('noticeContent').innerHTML=html;
    openModal('noticeModal');

  }catch(error){
    console.error('收信提醒失败:',error);
  }
}

/* ===============================
   实时监听新漂流瓶
================================ */
function subscribeBottles(){
  db.channel('bottles-live')
    .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'bottles'
    },()=>{
      renderBubbles();
    })
    .subscribe();
}

/* ===============================
   页面初始化
================================ */
async function init(){

  // 原有功能：读取最近15条情绪扩散记录
  await loadOceanColors();

  // 新增功能：读取最近30条情绪词
  await loadEmotionWords();

  // 原有功能：加载漂流瓶气泡
  await renderBubbles();

  // 原有功能：检查是否收到回音
  await checkReplies();

  // 原有功能：实时监听情绪
  subscribeOcean();

  // 原有功能：实时监听漂流瓶
  subscribeBottles();
}

document.addEventListener('DOMContentLoaded',init);

// 点击弹窗外部关闭
document.querySelectorAll('.modal').forEach(modal=>{
  modal.addEventListener('click',e=>{
    if(e.target===modal){
      modal.classList.remove('show');
    }
  });
});

// ESC关闭弹窗
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    document.querySelectorAll('.modal.show').forEach(modal=>{
      modal.classList.remove('show');
    });
  }
});
</script>

</body>
</html>
